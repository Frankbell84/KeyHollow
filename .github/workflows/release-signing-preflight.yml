name: Verify KeyHollow Release Signing

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Full 40-character main commit SHA expected to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: keyhollow-production-testflight
  cancel-in-progress: false

jobs:
  sign-without-upload:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    environment: production-testflight
    env:
      TEAM_ID: P38X56QHU9
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      EXPECTED_API_KEY_ID: W3UF745JN4
      EXPECTED_API_ISSUER_ID: ba45844d-8147-4d78-932b-bfdbbbc55dc0
      EXPECTED_SIGNING_CERTIFICATE_SHA1: 7E2342E196D2A56E95A05BCBDD473FE3799B7EDD
      EXPECTED_APP_PROFILE_UUID: b9a24dc9-04a3-40e1-b0e3-fe7538e6e341
      EXPECTED_THUMBNAIL_PROFILE_UUID: c9564b6f-22cd-490b-9f59-f91e98a4a065

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow security
        run: python3 -I scripts/check_workflow_security.py

      - name: Verify selected production commit
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected commit SHA must be exactly 40 lowercase hexadecimal characters.'
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Expected commit $EXPECTED_COMMIT_SHA does not match workflow commit $GITHUB_SHA."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Checked-out commit does not match GITHUB_SHA.'
            exit 1
          fi

      - name: Verify pinned Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.0.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17A400'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.0'
          python3 -I -c 'import json, subprocess, sys; runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "available", "-j"])); available = any(runtime.get("identifier") == "com.apple.CoreSimulator.SimRuntime.iOS-26-0" and runtime.get("isAvailable") for runtime in runtimes.get("runtimes", [])); print("Verified available iOS 26.0 runtime." if available else "Required iOS 26.0 runtime is unavailable."); sys.exit(0 if available else 1)'

      - name: Verify exact-source CI succeeded
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/verify_release_source.py

      - name: Verify protected production environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_RELEASE_GUARD: ${{ secrets.PRODUCTION_RELEASE_GUARD }}
        run: python3 -I scripts/verify_release_environment.py

      - name: Verify release hygiene
        run: python3 -I scripts/check_release_hygiene.py

      - name: Verify architecture boundaries
        run: python3 -I scripts/check_architecture_boundaries.py

      - name: Test signing-material verifier
        run: python3 -I scripts/verify_signing_material.py --self-test

      - name: Test TestFlight build-number guard
        run: node scripts/verify_testflight_build_number.mjs --self-test

      - name: Verify privacy manifest
        run: python3 -I scripts/check_privacy_manifest.py

      - name: Verify production identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:[[:space:]]*com\.keyhollow\.app[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*CFBundleDisplayName:[[:space:]]*KeyHollow[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*MARKETING_VERSION:[[:space:]]*1\.0[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:[[:space:]]*com\.keyhollow\.app\.vault-thumbnail[[:space:]]*$' project.yml

          PROJECT_BUILDS=$(awk -F: '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { gsub(/[[:space:]]/, "", $2); print $2 }' project.yml | sort -u)
          if [[ ! "$PROJECT_BUILDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Every product must share one positive-integer build number.'
            exit 1
          fi

      - name: Install XcodeGen
        run: bash scripts/install_xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify App Store Connect authentication
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_APP_ID: 6807022780
        run: |
          set -euo pipefail
          if [[ "$APP_STORE_CONNECT_API_KEY_ID" != "$EXPECTED_API_KEY_ID" || \
                "$APP_STORE_CONNECT_API_ISSUER_ID" != "$EXPECTED_API_ISSUER_ID" ]]; then
            echo 'App Store Connect credential identity does not match the approved rotation.'
            exit 1
          fi
          node scripts/verify_testflight_build_number.mjs --auth-only

      - name: Archive KeyHollow without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyHollowPreflight.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived build and privacy manifest
        run: |
          set -euo pipefail

          APP_PATH='build/KeyHollowPreflight.xcarchive/Products/Applications/KeyHollow.app'
          EXTENSION_PATH="$APP_PATH/PlugIns/KeyHollowVaultThumbnail.appex"
          python3 -I scripts/check_privacy_manifest.py --app-bundle "$APP_PATH"
          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = \
            'com.keyhollow.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTENSION_PATH/Info.plist")" = \
            'com.keyhollow.app.vault-thumbnail'

      - name: Install and verify cloud-signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          THUMBNAIL_PROVISION_PROFILE_BASE64: ${{ secrets.THUMBNAIL_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          CERTIFICATE_PATH="$RUNNER_TEMP/keyhollow-distribution.p12"
          SIGNING_CERTIFICATE_PEM="$RUNNER_TEMP/keyhollow-distribution.pem"
          SIGNING_CERTIFICATE_DER="$RUNNER_TEMP/keyhollow-distribution.cer"
          KEYCHAIN_PATH="$RUNNER_TEMP/keyhollow-signing.keychain-db"
          APP_PROFILE_PATH="$RUNNER_TEMP/keyhollow-app.mobileprovision"
          THUMBNAIL_PROFILE_PATH="$RUNNER_TEMP/keyhollow-thumbnail.mobileprovision"
          APP_PROFILE_PLIST="$RUNNER_TEMP/keyhollow-app-profile.plist"
          THUMBNAIL_PROFILE_PLIST="$RUNNER_TEMP/keyhollow-thumbnail-profile.plist"
          PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$THUMBNAIL_PROVISION_PROFILE_BASE64" | base64 --decode > "$THUMBNAIL_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -x -T /usr/bin/codesign -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin env:P12_PASSWORD -out "$SIGNING_CERTIFICATE_PEM"
          LEAF_CERTIFICATE_COUNT=$(awk '/-----BEGIN CERTIFICATE-----/ { count += 1 } END { print count + 0 }' "$SIGNING_CERTIFICATE_PEM")
          if [[ "$LEAF_CERTIFICATE_COUNT" != 1 ]]; then
            echo "Expected exactly one non-CA signing certificate in the PKCS#12 archive, found $LEAF_CERTIFICATE_COUNT."
            exit 1
          fi
          openssl x509 \
            -in "$SIGNING_CERTIFICATE_PEM" \
            -outform DER \
            -out "$SIGNING_CERTIFICATE_DER"
          CERTIFICATE_SUBJECT=$(openssl x509 -in "$SIGNING_CERTIFICATE_PEM" -noout -subject -nameopt RFC2253)
          if [[ "$CERTIFICATE_SUBJECT" != *"CN=Apple Distribution:"* || "$CERTIFICATE_SUBJECT" != *"OU=$TEAM_ID"* ]]; then
            echo 'Signing certificate subject does not match the KeyHollow Apple team.'
            exit 1
          fi
          SIGNING_CERTIFICATE_SHA1=$(shasum -a 1 "$SIGNING_CERTIFICATE_DER" | awk '{ print toupper($1) }')
          if [[ ! "$SIGNING_CERTIFICATE_SHA1" =~ ^[0-9A-F]{40}$ ]]; then
            echo 'Signing certificate fingerprint is not a canonical SHA-1 value.'
            exit 1
          fi
          if [[ "$SIGNING_CERTIFICATE_SHA1" != "$EXPECTED_SIGNING_CERTIFICATE_SHA1" ]]; then
            echo 'Signing certificate does not match the approved rotation.'
            exit 1
          fi

          IDENTITY_LIST=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          VALID_IDENTITY_COUNT=$(printf '%s\n' "$IDENTITY_LIST" | awk '$1 ~ /^[0-9]+\)$/ && length($2) == 40 && $2 ~ /^[0-9A-Fa-f]+$/ { count += 1 } END { print count + 0 }')
          if [[ "$VALID_IDENTITY_COUNT" != 1 ]]; then
            echo "Expected exactly one valid code-signing identity in the isolated signing keychain, found $VALID_IDENTITY_COUNT."
            exit 1
          fi
          IDENTITY_MATCH_COUNT=$(printf '%s\n' "$IDENTITY_LIST" | awk -v expected="$SIGNING_CERTIFICATE_SHA1" '$1 ~ /^[0-9]+\)$/ && toupper($2) == expected { count += 1 } END { print count + 0 }')
          if [[ "$IDENTITY_MATCH_COUNT" != 1 ]]; then
            echo 'The sole valid code-signing identity does not match the approved certificate.'
            exit 1
          fi
          unset IDENTITY_LIST
          rm -f "$CERTIFICATE_PATH"
          unset BUILD_CERTIFICATE_BASE64 P12_PASSWORD

          security cms -D -i "$APP_PROFILE_PATH" > "$APP_PROFILE_PLIST"
          security cms -D -i "$THUMBNAIL_PROFILE_PATH" > "$THUMBNAIL_PROFILE_PLIST"
          unset \
            BUILD_CERTIFICATE_BASE64 \
            BUILD_PROVISION_PROFILE_BASE64 \
            THUMBNAIL_PROVISION_PROFILE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD
          python3 -I scripts/verify_signing_material.py \
            --certificate-der "$SIGNING_CERTIFICATE_DER" \
            --app-profile-plist "$APP_PROFILE_PLIST" \
            --thumbnail-profile-plist "$THUMBNAIL_PROFILE_PLIST" \
            --expected-app-uuid "$EXPECTED_APP_PROFILE_UUID" \
            --expected-thumbnail-uuid "$EXPECTED_THUMBNAIL_PROFILE_UUID"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$APP_PROFILE_PLIST")
          THUMBNAIL_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$THUMBNAIL_PROFILE_PLIST")
          UUID_PATTERN='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [[ ! "$APP_PROFILE_UUID" =~ $UUID_PATTERN || ! "$THUMBNAIL_PROFILE_UUID" =~ $UUID_PATTERN ]]; then
            echo 'Provisioning profile UUID is not canonical.'
            exit 1
          fi
          NORMALIZED_APP_PROFILE_UUID=$(printf '%s' "$APP_PROFILE_UUID" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_THUMBNAIL_PROFILE_UUID=$(printf '%s' "$THUMBNAIL_PROFILE_UUID" | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_APP_PROFILE_UUID" != "$EXPECTED_APP_PROFILE_UUID" || \
                "$NORMALIZED_THUMBNAIL_PROFILE_UUID" != "$EXPECTED_THUMBNAIL_PROFILE_UUID" ]]; then
            echo 'Provisioning profiles do not match the approved rotation.'
            exit 1
          fi

          mkdir -p "$PROFILE_DIRECTORY"
          echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "THUMBNAIL_PROFILE_UUID=$THUMBNAIL_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE_SHA1=$SIGNING_CERTIFICATE_SHA1" >> "$GITHUB_ENV"
          cp "$APP_PROFILE_PATH" "$PROFILE_DIRECTORY/$EXPECTED_APP_PROFILE_UUID.mobileprovision"
          cp "$THUMBNAIL_PROFILE_PATH" "$PROFILE_DIRECTORY/$EXPECTED_THUMBNAIL_PROFILE_UUID.mobileprovision"

      - name: Create fingerprint-bound export options
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :destination string export' build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $SIGNING_CERTIFICATE_SHA1" build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.keyhollow.app string $APP_PROFILE_UUID" build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.keyhollow.app.vault-thumbnail string $THUMBNAIL_PROFILE_UUID" build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/PreflightExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' build/PreflightExportOptions.plist

      - name: Export signed IPA without uploading
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/KeyHollowPreflight.xcarchive \
            -exportPath build/preflight-export \
            -exportOptionsPlist build/PreflightExportOptions.plist

      - name: Verify signed IPA and exact signing material
        run: |
          set -euo pipefail

          IPA_PATHS=$(find build/preflight-export -maxdepth 1 -type f -name '*.ipa' -print)
          IPA_COUNT=$(printf '%s\n' "$IPA_PATHS" | awk 'NF { count += 1 } END { print count + 0 }')
          if [[ "$IPA_COUNT" != 1 ]]; then
            echo "Preflight must produce exactly one IPA, found $IPA_COUNT."
            exit 1
          fi
          IPA_PATH="$IPA_PATHS"

          EXPANDED_IPA_PATH="$RUNNER_TEMP/keyhollow-preflight-ipa"
          rm -rf "$EXPANDED_IPA_PATH"
          mkdir -p "$EXPANDED_IPA_PATH"
          ditto -x -k "$IPA_PATH" "$EXPANDED_IPA_PATH"

          SIGNED_APP_PATH="$EXPANDED_IPA_PATH/Payload/KeyHollow.app"
          SIGNED_EXTENSION_PATH="$SIGNED_APP_PATH/PlugIns/KeyHollowVaultThumbnail.appex"
          test -d "$SIGNED_APP_PATH"
          test -d "$SIGNED_EXTENSION_PATH"
          codesign --verify --deep --strict --verbose=2 "$SIGNED_APP_PATH"
          codesign --verify --strict --verbose=2 "$SIGNED_EXTENSION_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_APP_PATH/Info.plist")" = \
            'com.keyhollow.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_EXTENSION_PATH/Info.plist")" = \
            'com.keyhollow.app.vault-thumbnail'

          security cms -D \
            -i "$SIGNED_APP_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/keyhollow-signed-app-profile.plist"
          security cms -D \
            -i "$SIGNED_EXTENSION_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/keyhollow-signed-thumbnail-profile.plist"
          python3 -I scripts/verify_signing_material.py \
            --certificate-der "$RUNNER_TEMP/keyhollow-distribution.cer" \
            --app-profile-plist "$RUNNER_TEMP/keyhollow-signed-app-profile.plist" \
            --thumbnail-profile-plist "$RUNNER_TEMP/keyhollow-signed-thumbnail-profile.plist" \
            --expected-app-uuid "$APP_PROFILE_UUID" \
            --expected-thumbnail-uuid "$THUMBNAIL_PROFILE_UUID"

          APP_CERTIFICATE_DIRECTORY="$RUNNER_TEMP/keyhollow-signed-app-certificates"
          THUMBNAIL_CERTIFICATE_DIRECTORY="$RUNNER_TEMP/keyhollow-signed-thumbnail-certificates"
          test ! -e "$APP_CERTIFICATE_DIRECTORY"
          test ! -e "$THUMBNAIL_CERTIFICATE_DIRECTORY"
          mkdir -p "$APP_CERTIFICATE_DIRECTORY" "$THUMBNAIL_CERTIFICATE_DIRECTORY"
          codesign --display \
            --extract-certificates="$APP_CERTIFICATE_DIRECTORY/cert" \
            "$SIGNED_APP_PATH"
          codesign --display \
            --extract-certificates="$THUMBNAIL_CERTIFICATE_DIRECTORY/cert" \
            "$SIGNED_EXTENSION_PATH"
          if ! cmp -s "$RUNNER_TEMP/keyhollow-distribution.cer" "$APP_CERTIFICATE_DIRECTORY/cert0"; then
            echo 'The signed app does not use the approved distribution certificate.'
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/keyhollow-distribution.cer" "$THUMBNAIL_CERTIFICATE_DIRECTORY/cert0"; then
            echo 'The signed thumbnail extension does not use the approved distribution certificate.'
            exit 1
          fi

          echo 'Release-signing preflight passed; no build was uploaded or published.'

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/keyhollow-signing.keychain-db"
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security lock-keychain "$KEYCHAIN_PATH" || echo '::warning::Could not lock the temporary signing keychain before deletion.'
            if ! security delete-keychain "$KEYCHAIN_PATH"; then
              echo '::warning::Keychain Services could not delete the temporary signing keychain; removing its exact file path.'
              rm -f "$KEYCHAIN_PATH"
            fi
          fi
          PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          rm -f \
            "$RUNNER_TEMP/keyhollow-distribution.p12" \
            "$RUNNER_TEMP/keyhollow-distribution.pem" \
            "$RUNNER_TEMP/keyhollow-distribution.cer" \
            "$RUNNER_TEMP/keyhollow-app.mobileprovision" \
            "$RUNNER_TEMP/keyhollow-thumbnail.mobileprovision" \
            "$RUNNER_TEMP/keyhollow-app-profile.plist" \
            "$RUNNER_TEMP/keyhollow-thumbnail-profile.plist" \
            "$RUNNER_TEMP/keyhollow-signed-app-profile.plist" \
            "$RUNNER_TEMP/keyhollow-signed-thumbnail-profile.plist" \
            "$PROFILE_DIRECTORY/$EXPECTED_APP_PROFILE_UUID.mobileprovision" \
            "$PROFILE_DIRECTORY/$EXPECTED_THUMBNAIL_PROFILE_UUID.mobileprovision" \
            build/PreflightExportOptions.plist
          rm -rf \
            "$RUNNER_TEMP/keyhollow-preflight-ipa" \
            "$RUNNER_TEMP/keyhollow-signed-app-certificates" \
            "$RUNNER_TEMP/keyhollow-signed-thumbnail-certificates" \
            build/KeyHollowPreflight.xcarchive \
            build/preflight-export
